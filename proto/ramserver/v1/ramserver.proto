syntax = "proto3";

package ramserver.v1;

option go_package = "github.com/stevenlagoy/ramserver-core/server/gen/ramserver/v1;ramserver";
option java_multiple_files = true;
option java_outer_classname = "RamServerProto";
option java_package = "org.ramserver.proto.v1";

// =============================================================================
// Envelopes
// =============================================================================

// ClientMessage is any message sent from a client to the server.
message ClientMessage {
  uint64 sequence = 1;
  oneof payload {
    ConnectRequest connect_request = 2;
    AuthRequest auth_request = 3;
    JoinLobbyRequest join_lobby_request = 4;
    LeaveLobbyRequest leave_lobby_request = 5;
    StartGameRequest start_game_request = 6;
    ActionRequest action_request = 7;
  }
}

// ServerMessage is any message sent from the server to a client.
message ServerMessage {
  uint64 in_reply_to = 1; // echoes ClientMessage.sequence when this is a direct reply; 0 for unsolicited pushes (e.g. broadcasts)
  oneof payload {
    ConnectResponse connect_response = 2;
    AuthResponse auth_response = 3;
    LobbyUpdate lobby_update = 4;
    StateUpdate state_update = 5;
    ErrorResponse error_response = 6;
    MatchResult match_result = 7;
  }
}

// =============================================================================
// Connection & authentication
// =============================================================================

// ConnectRequest is the first message a client sends after opening the TCP
// connection. It establishes protocol compatibility before any auth or game
// logic runs.
message ConnectRequest {
  string protocol_version = 1;  // schema version this client was built against, e.g. "1.0.0"
  string client_name = 2;       // free-text identifier, e.g. "ramserver-java-client"
}

message ConnectResponse {
  bool accepted = 1;
  string session_id = 2;
  string server_protocol_version = 3;
  // If accepted is false, an ErrorResponse (code ERROR_CODE_INVALID_PROTOCOL_VERSION)
  // follows and the server closes the connection.
}

// AuthRequest either registers a new identity or resumes an existing one.
// display_name is purely cosmetic (shown to other players, may collide).
// Identity itself is never established by a name the client asserts — it is
// either newly issued by the server, or proven by presenting a secret token
// the server previously issued to that same identity.
message AuthRequest {
  string display_name = 1;         // shown to other players; not unique, not a credential

  // Leave both fields below empty to register as a brand-new player.
  // Set both to resume a previous identity (e.g. after a dropped connection).
  string player_id = 2;            // identity to resume, if any
  string reconnect_token = 3;      // secret previously issued for player_id; server-verified
}

message AuthResponse {
  bool authenticated = 1;
  string player_id = 2;            // newly issued, or the resumed id — the identity for this connection from now on
  string reconnect_token = 3;      // secret for this identity; store client-side only, never echoed to other players
}

// =============================================================================
// Lobby (pre-match): supports variable player counts per game
// =============================================================================

// JoinLobbyRequest asks to join an open lobby for a game, or create one if
// none is open. The server — not the client — enforces min/max players for
// game_id, using the constraints declared by that game's registered Ruleset.
// The first player to join a lobby becomes its host.
message JoinLobbyRequest {
  string game_id = 1;   // "tictactoe" | "chess" | "gofish"
  string lobby_id = 2;  // empty = join any open lobby for game_id, or create one
}

message LeaveLobbyRequest {
  string lobby_id = 1;
}

// StartGameRequest may only be sent by the lobby's host, and only once the
// lobby has reached min_players. Ignored (ErrorResponse) from any other
// sender, or before min_players is met.
message StartGameRequest {
  string lobby_id = 1;
}

// LobbyUpdate is broadcast to every player in a lobby whenever its
// membership or status changes, including the moment it transitions into
// an active match.
message LobbyUpdate {
  string lobby_id = 1;
  string game_id = 2;
  repeated LobbyPlayer players = 3;
  string host_player_id = 4;  // the one player who may send StartGameRequest
  int32 min_players = 5;      // echoed from the server's ruleset registry, not client-set
  int32 max_players = 6;
  LobbyStatus status = 7;
  string match_id = 8;        // set once status == LOBBY_STATUS_STARTING; the id to use in ActionRequest
}

message LobbyPlayer {
  string player_id = 1;
  string display_name = 2;
}

enum LobbyStatus {
  LOBBY_STATUS_UNSPECIFIED = 0;
  LOBBY_STATUS_WAITING = 1;   // below min_players for game_id
  LOBBY_STATUS_READY = 2;     // min_players met, below max_players — host may now start manually
  LOBBY_STATUS_STARTING = 3;  // match initializing, triggered by the host or by reaching max_players
  LOBBY_STATUS_CLOSED = 4;    // abandoned before starting, or superseded once the match begins
}

// =============================================================================
// Gameplay
// =============================================================================

// ActionRequest carries a game-specific action. The core never interprets
// encoded_action; it hands the bytes to the match's registered Ruleset.
// Note there is no player_id field here: the acting player is always
// resolved server-side from the authenticated connection, never from a
// client-supplied field, so one client can never submit an action as another
// player's identity.
message ActionRequest {
  string match_id = 1;
  bytes encoded_action = 2;
}

// StateUpdate carries a per-player view of the authoritative state, so
// games with hidden information (e.g. Go Fish hands) can withhold what a
// given recipient must not see. encoded_view is opaque to the core, same
// as encoded_action.
message StateUpdate {
  string match_id = 1;
  uint64 state_version = 2;       // monotonically increasing; lets a client detect a stale/duplicate broadcast
  bytes encoded_view = 3;
  string active_player_id = 4;    // whose turn it is now
  repeated string player_order = 5; // full turn order for the match; supports >2 players (e.g. Go Fish)
}

// =============================================================================
// Errors
// =============================================================================

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;    // human-readable detail, not meant to be pattern-matched by clients
  string match_id = 3;   // set if the error is scoped to a specific match/action; empty otherwise
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_PROTOCOL_VERSION = 1;
  ERROR_CODE_AUTH_FAILED = 2;            // unknown player_id, or reconnect_token does not match
  ERROR_CODE_UNKNOWN_GAME = 3;
  ERROR_CODE_LOBBY_FULL = 4;
  ERROR_CODE_LOBBY_NOT_FOUND = 5;
  ERROR_CODE_LOBBY_ALREADY_STARTED = 6;  // join attempted after status moved to STARTING/CLOSED
  ERROR_CODE_NOT_LOBBY_HOST = 7;         // StartGameRequest sent by a non-host player
  ERROR_CODE_LOBBY_NOT_READY = 8;        // StartGameRequest sent before min_players was met
  ERROR_CODE_MATCH_NOT_FOUND = 9;
  ERROR_CODE_OUT_OF_TURN = 10;
  ERROR_CODE_ILLEGAL_ACTION = 11;
  ERROR_CODE_MALFORMED_MESSAGE = 12;
}

// =============================================================================
// Match completion
// =============================================================================

message MatchResult {
  string match_id = 1;
  repeated string winner_player_ids = 2;  // empty if draw; more than one entry supports team/tie outcomes
  bool draw = 3;
  repeated PlayerActionSummary summaries = 4;
}

message PlayerActionSummary {
  string player_id = 1;
  int32 actions_accepted = 2;
  int32 actions_rejected = 3;
}
