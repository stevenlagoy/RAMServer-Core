syntax = "proto3";

package ramserver.v1;

option go_package = "github.com/stevenlagoy/ramserver-core/server/gen/ramserver/v1;ramserver";
option java_multiple_files = true;
option java_outer_classname = "RamServerProto";
option java_package = "org.ramserver.proto.v1";

// --- Envelopes ---

// Client request envelope.
message ClientMessage {
  uint64 sequence = 1;
  oneof payload {
    ConnectRequest connect_request = 2;
    AuthRequest auth_request = 3;
    JoinGameRequest join_game_request = 4;
    LeaveGameRequest leave_game_request = 5;
    ActionRequest action_request = 6;
  }
}

// Server response envelope.
message ServerMessage {
  uint64 in_reply_to = 1;
  oneof payload {
    ConnectResponse connect_response = 2;
    AuthResponse auth_response = 3;
    StateUpdate state_update = 4;
    ErrorResponse error_response = 5;
    MatchResult match_result = 6;
  }
}

// --- Connection & authentication ---

message ConnectRequest {
  string protocol_version = 1;
  string client_name = 2;
}

// Sent if connection is successful
message ConnectResponse {
  string connection_id = 1;
  string server_protocol_version = 2;
}

// Auth request payload.
message AuthRequest {
  string display_name = 1;
  string player_id = 2;
  string reconnect_token = 3;
}

// Sent if authentication is successful
message AuthResponse {
  string player_id = 1;
  string reconnect_token = 2;
}

// --- Session membership ---
// A session is one game instance from lobby through match end, identified by
// a single session_id for its whole lifecycle.

message JoinGameRequest {
  string game_id = 1;
  // Empty: the game's policy selects or creates a session.
  string session_id = 2;
}

message LeaveGameRequest {
  string session_id = 1;
}

// --- Session actions & state ---

// Game-defined action in any phase (e.g. a start vote or a move).
message ActionRequest {
  string session_id = 1;
  bytes encoded_action = 2;
}

// Session snapshot, broadcast on membership, status, or game-state changes.
message StateUpdate {
  string session_id = 1;
  string game_id = 2;
  SessionStatus status = 3;
  repeated SessionPlayer players = 4;
  uint64 state_version = 5;
  // Per-recipient view of game-defined state.
  bytes encoded_view = 6;
  // Empty while no player has the turn, e.g. before the match is in progress.
  string active_player_id = 7;
  repeated string player_order = 8;
}

message SessionPlayer {
  string player_id = 1;
  string display_name = 2;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_WAITING = 1;
  SESSION_STATUS_READY = 2;
  SESSION_STATUS_STARTING = 3;
  SESSION_STATUS_IN_PROGRESS = 4;
  SESSION_STATUS_CLOSED = 5;
}

// --- Errors ---

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
  string session_id = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_PROTOCOL_VERSION = 1;
  ERROR_CODE_AUTH_FAILED = 2;
  ERROR_CODE_UNKNOWN_GAME = 3;
  ERROR_CODE_SESSION_NOT_FOUND = 4;
  ERROR_CODE_SESSION_NOT_JOINABLE = 5;
  ERROR_CODE_OUT_OF_TURN = 6;
  ERROR_CODE_ILLEGAL_ACTION = 7;
  ERROR_CODE_MALFORMED_MESSAGE = 8;
}

// --- Match completion ---

message MatchResult {
  string session_id = 1;
  repeated string winner_player_ids = 2;
  bool draw = 3;
  repeated PlayerActionSummary summaries = 4;
}

message PlayerActionSummary {
  string player_id = 1;
  int32 actions_accepted = 2;
  int32 actions_rejected = 3;
}
