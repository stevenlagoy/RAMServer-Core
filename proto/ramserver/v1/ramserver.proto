syntax = "proto3";

package ramserver.v1;

option go_package = "github.com/stevenlagoy/ramserver-core/server/gen/ramserver/v1;ramserver";
option java_multiple_files = true;
option java_outer_classname = "RamServerProto";
option java_package = "org.ramserver.proto.v1";

// --- Envelopes ---

// Client request envelope.
message ClientMessage {
  uint64 sequence = 1;
  oneof payload {
    ConnectRequest connect_request = 2;
    AuthRequest auth_request = 3;
    JoinLobbyRequest join_lobby_request = 4;
    LeaveLobbyRequest leave_lobby_request = 5;
    StartGameRequest start_game_request = 6;
    ActionRequest action_request = 7;
  }
}

// Server response envelope.
message ServerMessage {
  uint64 in_reply_to = 1;
  oneof payload {
    ConnectResponse connect_response = 2;
    AuthResponse auth_response = 3;
    LobbyUpdate lobby_update = 4;
    StateUpdate state_update = 5;
    ErrorResponse error_response = 6;
    MatchResult match_result = 7;
  }
}

// --- Connection & authentication ---

message ConnectRequest {
  string protocol_version = 1;
  string client_name = 2;
}

// Sent if connection is successful
message ConnectResponse {
  string session_id = 2;
  string server_protocol_version = 3;
}

// Auth request payload.
message AuthRequest {
  string display_name = 1;
  string player_id = 2;
  string reconnect_token = 3;
}

// Sent if authentication is successful
message AuthResponse {
  bool authenticated = 1;
  string player_id = 2;
  string reconnect_token = 3;
}

// --- Lobby ---

message JoinLobbyRequest {
  string game_id = 1;
  string lobby_id = 2;
}

message LeaveLobbyRequest {
  string lobby_id = 1;
}

message StartGameRequest {
  string lobby_id = 1;
}

// Lobby state update.
message LobbyUpdate {
  string lobby_id = 1;
  string game_id = 2;
  repeated LobbyPlayer players = 3;
  string host_player_id = 4;
  int32 min_players = 5;
  int32 max_players = 6;
  LobbyStatus status = 7;
  string match_id = 8;
}

message LobbyPlayer {
  string player_id = 1;
  string display_name = 2;
}

enum LobbyStatus {
  LOBBY_STATUS_UNSPECIFIED = 0;
  LOBBY_STATUS_WAITING = 1;
  LOBBY_STATUS_READY = 2;
  LOBBY_STATUS_STARTING = 3;
  LOBBY_STATUS_CLOSED = 4;
}

// --- Gameplay ---

message ActionRequest {
  string match_id = 1;
  bytes encoded_action = 2;
}

message StateUpdate {
  string match_id = 1;
  uint64 state_version = 2;
  bytes encoded_view = 3;
  string active_player_id = 4;
  repeated string player_order = 5;
}

// --- Errors ---

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
  string match_id = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_PROTOCOL_VERSION = 1;
  ERROR_CODE_AUTH_FAILED = 2;
  ERROR_CODE_UNKNOWN_GAME = 3;
  ERROR_CODE_LOBBY_FULL = 4;
  ERROR_CODE_LOBBY_NOT_FOUND = 5;
  ERROR_CODE_LOBBY_ALREADY_STARTED = 6;
  ERROR_CODE_NOT_LOBBY_HOST = 7;
  ERROR_CODE_LOBBY_NOT_READY = 8;
  ERROR_CODE_MATCH_NOT_FOUND = 9;
  ERROR_CODE_OUT_OF_TURN = 10;
  ERROR_CODE_ILLEGAL_ACTION = 11;
  ERROR_CODE_MALFORMED_MESSAGE = 12;
}

// --- Match completion ---

message MatchResult {
  string match_id = 1;
  repeated string winner_player_ids = 2;
  bool draw = 3;
  repeated PlayerActionSummary summaries = 4;
}

message PlayerActionSummary {
  string player_id = 1;
  int32 actions_accepted = 2;
  int32 actions_rejected = 3;
}
