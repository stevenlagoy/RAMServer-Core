services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      RAMSERVER_ADDR: ":8080"
      RAMSERVER_AUTOREADY: ${RAMSERVER_AUTOREADY:-}
    volumes:
      - ramserver-data:/app/data
    restart: unless-stopped

volumes:
  ramserver-data:
