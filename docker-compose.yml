services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      RAMSERVER_ADDR: ":9000"
      RAMSERVER_STUB_GAME: ${RAMSERVER_STUB_GAME:-}
    volumes:
      - ramserver-data:/app/data
    restart: unless-stopped

volumes:
  ramserver-data:
