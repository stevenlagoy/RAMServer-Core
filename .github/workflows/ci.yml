name: CI

on:
  push:
    branches:
      - 'feature/20-interpreted-chess-client'
      - 'python-chess'
  pull_request:
    branches:
      - 'feature/20-interpreted-chess-client'
      - 'python-chess'

jobs:
  proto:
    name: Protocol lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: sudo apt-get update && sudo apt-get install -y diffutils
      - run: buf lint
      - run: buf format --diff --exit-code

  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.sum
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Generate protobuf code
        run: buf generate
        working-directory: .
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage.out

  python:
    name: Python chess client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/pychess
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: clients/pychess/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Generate protobuf code
        run: buf generate
        working-directory: ${{ github.workspace }}
      - name: Run Python tests
        run: python -m pytest tests

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false