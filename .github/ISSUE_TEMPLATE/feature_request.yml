name: Feature request
description: Propose a new capability or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the desired outcome and why it matters. A proposal is not a commitment to implement the feature.
  - type: textarea
    id: summary
    attributes:
      label: Feature summary
      description: What should RAMServer-Core or its tooling be able to do?
      placeholder: As a ..., I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation and problem
      description: What limitation or user problem motivates this request?
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Intended users and use cases
      description: Who benefits, and in what situations?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Discuss expected effects on server core, protocol, clients, persistence, security, compatibility, and operations. Mark areas that do not apply.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable conditions would demonstrate that the feature is complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and additional context
      description: Describe alternatives considered, related issues, or supporting material.
    validations:
      required: false
